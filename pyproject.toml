[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "au-ree-5stage"
version = "1.0.2"
description = "Auditable, incremental Australian REE census, criteria, GIS, eligibility and R-MCDA pipeline"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "pyproj>=3.5"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
au-ree = "au_ree.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
