name: Bootstrap verified v1.0.2 source
on:
  push:
    branches: [feature/v1.0.2-official-census]
    paths: [AU_REE_v1.0.2_official_census_source.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact original archive
        run: |
          echo "8e0db1728e52576c22c69eb75629489f56ea4ee5faeab9e0b98689066d5e8dd6  AU_REE_v1.0.2_official_census_source.zip" | sha256sum --check
      - name: Extract editable files, rejecting unsafe ZIP paths
        run: |
          python - <<'PY'
          import pathlib,shutil,zipfile
          archive=pathlib.Path('AU_REE_v1.0.2_official_census_source.zip')
          root='AU_REE_v1.0.2_official_census/'
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert item.filename.startswith(root) and not p.is_absolute() and '..' not in p.parts, item.filename
                  assert (item.external_attr >> 16) & 0o170000 != 0o120000, item.filename
              z.extractall('_import')
          src=pathlib.Path('_import')/root
          assert (src/'pyproject.toml').is_file()
          assert (src/'src/au_ree/cli.py').is_file()
          assert (src/'R/run_mcda.R').is_file()
          for file in src.iterdir():
              if file.is_dir(): shutil.copytree(file,file.name,dirs_exist_ok=True)
              else: shutil.copy2(file,file.name)
          shutil.rmtree('_import')
          archive.unlink()
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline regression
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m au_ree run --through r_export --offline --db work/research.sqlite --workspace work
          python -m au_ree run --through r_export --offline --db work/research.sqlite --workspace work | tee work/reuse.log
          python - <<'PY'
          import sqlite3
          d=sqlite3.connect('work/research.sqlite')
          assert d.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not d.execute('PRAGMA foreign_key_check').fetchall()
          assert d.execute('SELECT count(*) FROM project_master').fetchone()[0]==203
          assert d.execute('SELECT count(*) FROM criteria').fetchone()[0]==12
          assert d.execute("SELECT count(*) FROM observations WHERE verification='VERIFIED'").fetchone()[0]==0
          assert open('work/reuse.log').read().count('REUSED')==5
          PY
      - name: Commit and push editable source (not archive)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: import verified AU REE v1.0.2 source'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Save offline QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: au-ree-v102-offline-qa
          path: |
            work/research.sqlite
            work/outputs
            work/reuse.log
          if-no-files-found: warn
