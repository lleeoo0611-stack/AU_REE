name: Structural round 01 evidence verification
on:
  push:
  pull_request:
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_structural_round01.py --check
      - run: python -m unittest discover -s tests -p test_structural_round01.py -v
      - run: python -m unittest discover -s tests -p test_research_pipeline_supervisor_v1.py -v
      - run: python scripts/run_research_pipeline.py --profile all --mode check
