name: Scheme A screen from completed national raw archive
on:
  push:
    branches: [main]
    paths: ['ops/national-screen-from-raw-trigger.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  national-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Read frozen raw-source run identifier
        id: source
        run: |
          echo "run_id=$(python -c "import json;print(json.load(open('ops/national-screen-from-raw-trigger.json'))['raw_run_id'])")" >> "$GITHUB_OUTPUT"
      - name: Download the complete official original archive
        uses: actions/download-artifact@v4
        with:
          name: australia-national-unfiltered-raw-inventory
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: lleeoo0611-stack/AU_REE
          path: work
      - name: Independently verify raw-source gate and expected source manifest
        run: |
          python scripts/verify_national_raw.py --raw-dir work/national_raw
          python - <<'PY'
          import json,hashlib,pathlib
          t=json.loads(pathlib.Path('ops/national-screen-from-raw-trigger.json').read_text())
          sha=hashlib.sha256(pathlib.Path('work/national_raw/national_raw_manifest.json').read_bytes()).hexdigest()
          assert sha==t['expected_manifest_sha256'],(sha,t['expected_manifest_sha256'])
          print('Pinned national raw manifest verified:',sha)
          PY
      - name: Scheme A only after national raw QA passes
        run: |
          python scripts/screen_national_raw.py --raw-dir work/national_raw --out work/national_screening
          python - <<'PY'
          import json,pathlib,sqlite3
          s=json.loads(pathlib.Path('work/national_screening/screening_summary.json').read_text())
          assert s['gate']=='PASSED_BEFORE_SCREENING'
          assert s['project_master_new_records']==0
          assert s['project_identity_merges_automatic']==0
          assert sum(s['tier_counts'].values())==s['screened_candidate_records']
          assert all(s['tier_counts'].get(k,0)>0 for k in ('E1_DIRECT_REE','E2_REE_MINERAL_ONLY','E3_GEOLOGICAL_CONTEXT'))
          c=sqlite3.connect('work/national_screening/national_screening_review.sqlite')
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert c.execute('SELECT COUNT(*) FROM source_candidates').fetchone()[0]==s['screened_candidate_records']
          print('SCHEME_A_NATIONAL_SCREEN_QA_PASS')
          PY
      - name: Upload reviewable national candidates and dedup queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: australia-national-ree-scheme-a-screening-review
          path: |
            work/national_screening
            work/national_raw/national_raw_manifest.json
            work/national_raw/raw_validation.json
          retention-days: 14
          if-no-files-found: warn
