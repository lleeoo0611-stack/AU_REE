name: External technical primary batch 01 audit
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fixed IDs and bounded evidence
        run: python scripts/check_external_primary_batch.py
      - name: Test substantive audit, no false closure, and Scaddan gap
        run: python -m unittest discover -s tests -p test_external_primary_batch.py -v
