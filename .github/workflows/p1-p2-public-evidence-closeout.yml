name: P1 P2 public evidence documentary closeout
on:
  pull_request:
    paths:
      - 'scripts/audit_p1_p2_public_evidence.py'
      - 'tests/test_p1_p2_public_evidence.py'
      - 'inputs/source_review_20261031/p1_19_public_remaining_case_adjudications.csv'
      - 'inputs/source_review_20261031/p2_27_public_evidence_adjudications.csv'
      - 'docs/audits/2026-10-31_p1_31_remaining_public_source_review.csv'
      - 'docs/audits/2026-10-31_p2_28_public_terminal_desk_review.csv'
      - 'docs/audits/2026-10-31_p1_p2_public_review_summary.json'
      - '.github/workflows/p1-p2-public-evidence-closeout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-evidence-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/audit_p1_p2_public_evidence.py --check
      - run: python -m unittest discover -s tests -p 'test_p1_p2_public_evidence.py' -v
