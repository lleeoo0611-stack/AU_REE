name: Official REE population refresh (not verified ranking)
on:
  push:
    branches: [main]
    paths: ['ops/official-refresh-trigger.json']
  workflow_dispatch:
    inputs:
      source_key:
        description: 'Choose official API source; ALL uses all enabled ArcGIS sources'
        required: true
        type: choice
        default: ALL
        options:
          - ALL
          - GA_AIMR_REE_2026
          - GA_CRITICAL_DEPOSITS_2025
          - STATE_WA_MINDEX
          - STATE_QLD_MINOCC
          - STATE_TAS_MRT
  schedule:
    - cron: '17 1 1 * *'
permissions:
  contents: read
concurrency:
  group: ree-census-refresh
  cancel-in-progress: false
jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Unit tests, fail closed
        run: python -m pytest -q
      - name: Refresh official source, preserving immutable snapshots
        shell: bash
        env:
          SELECTED_SOURCE: ${{ inputs.source_key || 'ALL' }}
        run: |
          set -o pipefail
          if [ "$SELECTED_SOURCE" = 'ALL' ]; then
            python -m au_ree run --stage population --refresh \
              --db work/research.sqlite --workspace work | tee work/refresh.log
          else
            python -m au_ree run --stage population --source-key "$SELECTED_SOURCE" --refresh \
              --db work/research.sqlite --workspace work | tee work/refresh.log
          fi
      - name: Audit source registry and fail if official API refresh incomplete
        shell: bash
        env:
          SELECTED_SOURCE: ${{ inputs.source_key || 'ALL' }}
        run: |
          if [ "$SELECTED_SOURCE" = 'ALL' ]; then
            python scripts/verify_population_refresh.py \
              --db work/research.sqlite --report work/refresh_qa.json
          else
            python scripts/verify_population_refresh.py \
              --db work/research.sqlite --report work/refresh_qa.json \
              --source-key "$SELECTED_SOURCE"
          fi
      - name: Execute downstream stages (criteria, GIS, eligibility and R exports)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [ -f work/research.sqlite ]; then
            python -m au_ree run --through r_export \
              --db work/research.sqlite --workspace work \
              | tee work/full_pipeline.log
            python -m au_ree status \
              --db work/research.sqlite --workspace work \
              | tee work/stage_status.log
            python - <<'PY'
          import json,sqlite3,pathlib
          p=pathlib.Path('work/research.sqlite');db=sqlite3.connect(p)
          db.row_factory=sqlite3.Row
          def count(sql):
              try: return db.execute(sql).fetchone()[0]
              except sqlite3.OperationalError: return None
          summary={
            'project_master':count('SELECT count(*) FROM project_master'),
            'official_candidates':count("SELECT count(*) FROM population_candidates WHERE source_key!='legacy_r963_frozen'"),
            'approved_coordinates':count("SELECT count(*) FROM project_coordinates WHERE verification='VERIFIED'"),
            'criteria':count('SELECT count(*) FROM criteria'),
            'verified_observations':count("SELECT count(*) FROM observations WHERE verification='VERIFIED'"),
            'gis_metrics':count('SELECT count(*) FROM gis_metrics'),
            'mcda_eligible_rows':count('SELECT count(*) FROM eligibility WHERE point_ready=1'),
            'gis_release_gates':count('SELECT count(*) FROM gis_release_gates')
          }
          pathlib.Path('work/full_pipeline_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf8')
          print(json.dumps(summary,indent=2))
          PY
          else
            echo 'Cannot proceed: population SQLite missing' > work/full_pipeline.log
            exit 1
          fi
      - name: Upload raw snapshots, identity audits and SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-ree-population-snapshot
          path: |
            work/research.sqlite
            work/refresh.log
            work/refresh_qa.json
            work/cache/census
            work/outputs
            work/full_pipeline.log
            work/stage_status.log
            work/full_pipeline_summary.json
            work/snapshots
          if-no-files-found: warn
          retention-days: 14
