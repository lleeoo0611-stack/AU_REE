name: P0 70 source evidence review
on:
  push:
    branches:
      - research/p0-70-evidence-review-20261031
    paths:
      - scripts/audit_p0_70_project_parents.py
      - tests/test_p0_70_project_parents.py
      - inputs/source_review_20261031/round6_70_official_issuer_document_leads.csv
      - .github/workflows/p0-70-source-evidence-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review-70:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact 70-row evidence provenance and pending queue
        run: python scripts/audit_p0_70_project_parents.py
      - name: Check all 70 source identities and C1/REE/JORC gates
        run: python -m unittest discover -s tests -p test_p0_70_project_parents.py -v
      - name: Commit editable evidence snapshots and machine-readable manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/2026-10-31_70_project_evidence_review.csv docs/audits/2026-10-31_70_project_evidence_pending.csv docs/audits/2026-10-31_70_project_evidence_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "data(p0): publish 70-row source evidence review [skip ci]"
            git push origin HEAD:research/p0-70-evidence-review-20261031
          fi
