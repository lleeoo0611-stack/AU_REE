name: Official SA NT endpoint diagnostics
on:
  push:
    branches: [main]
    paths: ['ops/state-endpoint-diagnostics-trigger.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python scripts/probe_sa_nt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-endpoint-diagnostics
          path: work/probe2
          retention-days: 14