name: P234 144 original document scope review
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-content-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original-PDF reader
        run: python -m pip install pypdf==6.10.0
      - name: Reproduce sealed review bindings, findings and remaining gaps (original bytes local only)
        run: python scripts/review_p234_144_primary_scope.py --check
      - name: Fail-closed source, scope, geography and approval tests
        run: python -m unittest discover -s tests -p test_p234_144_primary_scope.py -v
